name: analyse actions

on:
  pull_request:
    branches:
      - master
    paths: &ci-paths
      - .github/workflows/*
  push:
    branches:
      - master
    paths: *ci-paths

permissions: {}

jobs:
  analyse:
    name: analyse actions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # upload-sarif (zizmor)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
