name: test

on:
  pull_request:
    branches: &ci-branches
      - master
      - ver/*
    paths: &ci-paths
      - src/**
      - tests/**
      - pyproject.toml
      - setup.py
      - .github/workflows/test-python-package.yml
  push:
    branches: *ci-branches
    paths: *ci-paths
    tags:
      - v* # zizmor: ignore[cache-poisoning] test workflow doesn't perform releases

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Update pip
      run: pip install -U pip
    - name: Install package, and lint and test requirements
      run: pip install
        --requirement ./tests/requirements.txt
        pytest pytest-cov .
    - name: Test with pytest
      run: |
        pytest -vvra \
          --cov proxpi \
          --cov-report xml \
          --cov-report term \
          --cov-config pyproject.toml

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.x
        cache: pip
    - name: Update pip
      run: pip install -U pip
    - name: Install lint requirements
      run: pip install black isort
    - name: Lint with black
      run: black --check src/
    - name: Sort imports with isort
      run: isort --check src/
